name: 功能建议
description: 提出一个新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认建议没有超出项目边界：聊天客户端本身不做文件工具、shell、MCP 或 agent 能力（这些属于官方 DSH）。边界与已规划路线见 [RESEARCH.md](https://github.com/manfredss/deepseek-blue-tui/blob/main/RESEARCH.md)。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在遇到什么不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 期望的交互或行为，最好有命令/界面示例
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: risks
    attributes:
      label: 权限与安全影响
      description: 是否会扩大权限面、触碰凭据或改变数据落盘行为？
