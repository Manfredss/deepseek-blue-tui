name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static check + unit tests + the cross-platform DSH lifecycle
      # integration test (stub DSH on every OS).
      - name: Typecheck and tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'check.log'
          npm run check *>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const text = fs.readFileSync(path.join(process.env.RUNNER_TEMP, "check.log"), "utf8");
              const lines = text.split(/\r?\n/);
              const interesting = lines.filter((line) => /^(not ok|# (tests|pass|fail|cancelled|skipped))|AssertionError|Promise resolution|Error:|MODULE_NOT_FOUND|Cannot find/i.test(line));
              for (const line of interesting.slice(-120)) {
                const safe = line.replace(/%/g, "%25").replace(/:/g, "%3A").replace(/\r/g, "%0D");
                console.log(`::error title=ci-check-log::${safe}`);
              }
            '
          }
          exit $status

      - name: Build
        run: npm run build

      - name: Verify built CLI
        run: node dist/cli.js --version

      - name: Verify package contents
        run: npm pack --dry-run

  install-smoke:
    name: install smoke (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Pack the real tarball, install it into an isolated prefix, and run
      # both binaries — this is what `npm install -g` users will execute.
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
        shell: bash

      - name: Install tarball into isolated prefix and run binaries
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/deepseek-prefix"
          TARBALL=$(ls "$RUNNER_TEMP"/deepseek-blue-tui-*.tgz)
          npm install --global --prefix "$PREFIX" --no-audit --no-fund "$TARBALL"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN_DIR="$PREFIX"
          else
            BIN_DIR="$PREFIX/bin"
          fi
          "$BIN_DIR/deepseek" --version
          "$BIN_DIR/dstui" --version
          "$BIN_DIR/deepseek" dsh status
