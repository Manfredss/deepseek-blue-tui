name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static check + unit tests + the cross-platform DSH lifecycle
      # integration test (stub DSH on every OS).
      - name: Typecheck and tests
        run: npm run check

      - name: Build
        run: npm run build

      # dist/ is committed, because npm cannot build a package installed
      # straight from a git source (it runs `prepare` without devDependencies
      # available). A stale dist would silently ship old code to anyone
      # installing from the repo, so fail the build instead.
      - name: Committed dist is up to date
        shell: bash
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit the result"
            git diff --stat -- dist
            exit 1
          fi

      - name: Verify built CLI
        run: node dist/cli.js --version

      - name: Verify package contents
        run: npm pack --dry-run

  install-smoke:
    name: install smoke (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Pack the real tarball, install it into an isolated prefix, and run
      # both binaries — this is what `npm install -g` users will execute.
      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
        shell: bash

      - name: Install tarball into isolated prefix and run binaries
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/deepseek-prefix"
          TARBALL=$(ls "$RUNNER_TEMP"/deepseek-blue-tui-*.tgz)
          npm install --global --prefix "$PREFIX" --no-audit --no-fund "$TARBALL"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN_DIR="$PREFIX"
          else
            BIN_DIR="$PREFIX/bin"
          fi
          "$BIN_DIR/deepseek" --version
          "$BIN_DIR/dstui" --version
          "$BIN_DIR/deepseek" dsh status
